name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Create Android platform files
        run: flutter create --platforms=android --org com.lafasoftware --project-name lafa_poultry_manager .

      - name: Patch Android permissions and notifications
        run: python3 scripts/patch_android.py

      - name: Install packages
        run: flutter pub get
        
      - name: Remove generated Flutter test
        run: rm -rf test

      - name: Analyze source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build installable release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LAFA-Poultry-Manager-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAFA-Poultry-Manager-v2-APK
          path: LAFA-Poultry-Manager-v2.apk
          retention-days: 30
