name: lafa_poultry_manager
description: LAFA Poultry Manager v2 - incubation, camera candling assistant, hatch and vaccination records.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Notifications
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1

  # Local storage
  shared_preferences: ^2.5.4

  # Dates and formatting
  intl: ^0.20.3

  # Camera / image handling
  image_picker: ^1.1.2
  image: ^4.5.4

  # Files and backup
  path_provider: ^2.1.5
  share_plus: ^10.1.4

  # Updated to avoid Android compileSdk 34 issue
  file_picker: ^10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
