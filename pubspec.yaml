publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^19.4.2
  shared_preferences: ^2.5.4
  intl: ^0.20.3
  timezone: ^0.10.1
  image_picker: ^1.1.2
  image: ^4.5.4
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
